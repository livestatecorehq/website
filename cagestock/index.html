.cs-filter-panel{margin:0 0 12px}.cs-filter-panel summary{width:max-content;cursor:pointer;line-height:44px;font-size:13px;font-weight:700;color:#345367}.cs-filter-panel .cs-filters{margin:0 0 8px}.cs-quick{margin-bottom:0}</style></head><body><header><strong>CAGE<span>STOCK</span></strong><small>Team supply demo</small></header><div class="sub">Demo illustrations &amp; prices · No orders or charges</div><main id="main"></main><script>(() => {
  'use strict';
  const formatMoney = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  const money = cents => formatMoney.format(cents / 100);
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char =>

  const categories = ['Locker room', 'Athletic training', 'Equipment & travel'];
  const icons = [
    '<path d="M8 7V4h8v3M7 7h10v13H7zM10 11h4"/>',
    '<path d="M8 5V3h8v2M4 6h16v14H4zM12 10v6m-3-3h6"/>',
    '<path d="m3 8 9-5 9 5-9 5zM3 8v9l9 5 9-5V8m-9 5v9M7.5 5.5l9 5"/>',
    '<path d="M7 20h10l-1-8-3-4V5H9v4l-3 4zM9 5V3h9l-2 2m-7 9h5"/>',
    '<rect x="4" y="3" width="16" height="18" rx="1"/><circle cx="12" cy="14" r="4"/><path d="M7 6h2m2 0h2"/>',
  ];
  const aliases = {
    tape: ['CS-AT-0004', 'CS-EQ-0001'], wrap: ['CS-AT-0005', 'CS-AT-0006'],
    bags: ['CS-AT-0008', 'CS-EQ-0004', 'CS-FC-0006'], soap: ['CS-LR-0001', 'CS-LR-0009'],
  };
  const available = p => p.cents !== null && p.availability !== 'out';
  const unit = (p, count) => count === 1 ? p.unit : ({ box: 'boxes', each: 'units' }[p.unit] || p.unit + 's');
  const icon = p => '<span class="cs-icon cs-icon-' + categories.indexOf(p.category) + '" aria-hidden="true">' +
    '<svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">' +
    (icons[categories.indexOf(p.category)] || icons[2]) + '</svg></span>';
  function productImage(p) {
    const image=p.image;
    if(!image && !p.retired && /^CS-(?:LR|AT|EQ)-\d{4}$/.test(p.sku))
      return '<img class="cs-photo" loading="lazy" width="280" height="280" src="./products/'+p.sku+'.jpg" alt="">';
    if(!image?.approvedBy || !image?.licenseNote ||
       !['manufacturer','licensed_supplier','own_photo'].includes(image.sourceType) ||
       !/^\/assets\/products\/[a-z0-9_./-]+\.(?:webp|jpe?g)$/i.test(image.url) || image.url.includes('..'))return icon(p);
    return '<img class="cs-photo" loading="lazy" width="48" height="48" src="'+escape(image.url)+'" alt="'+escape(p.name+', '+p.pack)+'">';
  }
  const label = p => p.availability === 'out' ? 'Out at source' : p.cents === null ? 'Price on request' : p.availability === 'limited' ? 'Limited' : 'Sample stock';
  const badge = p => '<span class="cs-availability ' + (available(p) ? 'cs-stock' : 'cs-unknown') + '">' + label(p) + '</span>';
  const button = (action, content, sku = '', css = '', attrs = '') =>
    '<button type="button" class="' + css + '" data-action="' + action + '" data-sku="' + escape(sku) + '" ' + attrs + '>' + content + '</button>';
  function productMatches(product, term) {
    const words = normal([product.name, product.pack, product.sku, ...product.synonyms].join(' ')).split(/\s+/);
    return normal(term).split(/\s+/).every(prefix => words.some(word => word.startsWith(prefix)));
  }
  function matches(term, products) {
    if (aliases[term]) return aliases[term].map(sku => products.find(p => p.sku === sku)).filter(Boolean);
    const exact = products.filter(p => p.synonyms.some(s => normal(s) === term) || normal(p.name) === term);
    if (exact.length) {
      const usuals = exact.filter(p => p.par);
      return usuals.length ? usuals : exact;
    }
    if (term.length < 3) return [];
    const partial = products.filter(p => productMatches(p,term));
    const usuals = partial.filter(p => p.par);
    return usuals.length ? usuals : partial;
  }
  function parseQuick(text, products) {
    return text.split(/[,;\n]|\s+and\s+/i).map(segment => {
      const clean = normal(segment).replace(/^(?:(?:i |we )?need |add |please )+/,'');
      const skip = /^skip\b/.test(clean);
      const words = clean.replace(/^skip\s+/, '');
      const amount = words.match(/^(\d+)(?:\s+|$)/);
      const term = words.replace(/^\d+\s*/, '').replace(/^(?:boxes|box|packs?|bottles?|cases?|cans?|rolls?|jars?|cartons?|units?)(?:\s+of)?\s+/, '').trim();
      const options = matches(term, products);
      return { term, skip, qty: amount ? Number(amount[1]) : null, options, sku: options.length === 1 ? options[0].sku : '' };
    }).filter(edit => edit.term);
  }
  window.showCatalog = async function showCatalog(root, api, role = 'manager', section = 'usuals') {
    if (root._csDestroy) root._csDestroy();
    let active = true, busy = false, saver = Promise.resolve(), pendingSaves = 0, saveError = '', draftMeta = {}, estimate, page = section === 'catalog' ? 'catalog' : 'usuals';
    let filtersOpen = false;

    let quantities, products, submittedId = '';

    const shell = document.createElement('section');

    quantities = { ...(draft.quantities || {}) };
    draftMeta = draft;
    po = draft.po || '';
    center = draft.costCenter || '';
    needBy = draft.needBy || '';
    const bySku = sku => products.find(p => p.sku === sku);
    const count = sku => Number(quantities[sku] || 0);
    const lines = () => products.filter(p => count(p.sku) > 0 && available(p));
    const subtotal = () => lines().reduce((sum,p) => sum + p.cents * count(p.sku),0);
    const signal = abort.signal;
    const actor = typeof role === 'string' ? role : role.role;
    const editable = ['manager','approver','operator','admin'].includes(actor);
    window.cageDraftCanLeave=async()=>{
      await saver;
      if(saveError && !window.confirm(saveError+' Leave and discard unsaved changes?'))return false;
      root._csDestroy();
      window.cageDraftCanLeave=null;
      return true;
    };
    function scheduleSave() {
      const snapshot = { quantities: { ...quantities }, po, costCenter: center, needBy };
      saveError = '';
      pendingSaves++;
      saver = saver.then(async () => {
        try {
          const saved = await api('/draft', 'PUT', {...snapshot, version:draftMeta.version, draftId:draftMeta.draftId});

          saveError = '';
        }
        catch (e) { saveError = e.message || 'Could not save draft.'; }
        finally {pendingSaves--;}
        if (live()) {
          const status = shell.querySelector('.cs-save');
          if (status) status.textContent = saveError || 'Demo draft saved';
        }
      });
    }
    function setQty(p, qty) {
      if (!editable || !available(p) || !Number.isSafeInteger(qty) || qty < 0 || qty > 9999 || qty % p.step) return;
      quantities[p.sku] = qty;
      estimate = null;
      scheduleSave();
    }
    const field = (id, title, value, type = 'text') => '<label class="cs-field">' + title +
      '<input type="' + type + '" id="' + id + '" value="' + escape(value) + '" maxlength="100"></label>';
    function summary(review = false) {
      const total = estimate?.totals;
      return '<aside class="cs-summary"><h3>' + (review ? 'Estimated invoice' : 'This refill') + '</h3>' +
        '<div class="cs-summary-row"><span>Merchandise · ' + lines().length + ' lines</span><strong>' + money(subtotal()) + '</strong></div>' +
        (review && total ? [['Estimated delivery',total.delivery_cents],['CageStock service fee',total.fee_cents],['Estimated tax',total.tax_cents],['Estimated total',total.total_cents]].map(([name,c]) => '<div class="cs-summary-row"><span>'+name+'</span><strong>'+money(c)+'</strong></div>').join('') : '') +
        (review && estimate?.has_unquoted_shipping ? '<p>Specialty freight awaits a quote.</p>' : '') +
        (review ? '<p>Illustrative estimate for this sample order.</p>' : '<p>Delivery, service fee and estimated tax appear at review.</p>') +
        (review ? button('submit', actor==='approver' && !estimate?.has_unquoted_shipping ? 'Approve order' : 'Preview sample invoice', '', 'cs-primary', busy ? 'disabled' : '') : button('review','Review order <span aria-hidden="true">→</span>', '', 'cs-primary', lines().length && editable ? '' : 'disabled')) +
        '<small>CageStock, a service of LiveState Technologies LLC.</small></aside>';
    }
    function controls(p) {
      if (!editable) return '';
      if (p.availability === 'out') return '<span class="cs-muted">Unavailable</span>';

    function row(p) {

        ? button('plus',incrementLabel?'+ Add '+escape(incrementLabel):'+ Add',p.sku,'cs-add','aria-label="Add '+escape(incrementLabel+' '+p.name).trim()+'"') : controls(p);

    function quickPanel() {
      return '<form class="cs-quick" id="csQuick"><label for="csSearch">Find supplies</label><div class="cs-quick-line"><input id="csSearch" autocomplete="off" maxlength="600" required placeholder="Search or type a refill list" value="'+escape(query)+'"><button class="cs-secondary" type="submit">Check list</button></div><div id="csSuggestions"></div></form>'+
        (!quickEdits.length ? '' : '<div class="cs-match"><h3>Check your changes</h3>'+quickEdits.map((e,i) => {
          const p=bySku(e.sku);
          if (!e.options.length) return '<p>Couldn’t match “'+escape(e.term)+'”. '+button('search-miss','Search catalog',String(i),'cs-link')+'</p>';
          if (!p) return '<div><b>Which '+escape(e.term)+'?</b><div class="cs-choices">'+e.options.map(v=>button('resolve',escape(v.name),v.sku,'cs-secondary','data-index="'+i+'"')).join('')+'</div></div>';
          if (!available(p) && !e.skip) return '<p>'+escape(p.name)+' · '+label(p)+'</p>';
          const q=e.skip?0:Math.ceil((e.qty ?? p.step)/p.step)*p.step;
          return '<p><b>'+escape(p.name)+'</b> · '+(e.skip ? 'Skip this refill' : q+' '+escape(unit(p,q)))+
            (e.qty && e.qty !== q && !e.skip ? ' (rounded up to a full pack)' : '')+'</p>';
        }).join('')+button('apply','Apply matched changes','','cs-primary')+' '+button('discard','Cancel','','cs-secondary')+'</div>');
    }
    function suggestions() {
      const term=normal(query).trim();
      if(!term)return '';
      const matches=products.filter(p=>!p.retired && productMatches(p,term));
      matches.sort((a,b)=>(b.lastPurchasedAt||'').localeCompare(a.lastPurchasedAt||'') ||
        (b.purchaseCount||0)-(a.purchaseCount||0) || a.name.localeCompare(b.name));
      return matches.slice(0,8).map(p=>button('suggest',escape(p.name)+'<small>'+escape(p.pack)+
        (p.purchaseCount?' · Previously purchased':'')+'</small>',p.sku,'cs-suggest')).join('');
    }
    function listing() {
      const usual=page==='usuals';
      let result=products.filter(p=>!p.retired && (!usual||query.trim()||p.par>0)&&(!category||p.category===category));
      if (filter==='stock') result=result.filter(available);
      if (filter==='usual') result=result.filter(p=>p.par>0);
      if (filter==='quote') result=result.filter(p=>p.cents===null);
      if (query.trim()) result=result.filter(p=>productMatches(p,query));
      result.sort((a,b)=>(b.purchaseCount||0)-(a.purchaseCount||0) || (usual ? (a.usualRank||100)-(b.usualRank||100) : 0));
      const priority=['CS-LR-0001','CS-LR-0017','CS-LR-0018','CS-LR-0004'];
      const starters=priority.map(bySku).filter(p=>result.includes(p));
      const shelf=(title,items)=>items.length ? '<section class="cs-shelf"><h2>'+escape(title)+'</h2><div class="cs-grid">'+items.map(row).join('')+'</div></section>' : '';
      if(!result.length)return '<div class="cs-empty">No matching supplies.</div>';
      if(query.trim()||category||filter||usual)return shelf(query.trim()?'Search results':category||'Matching supplies',result);
      return shelf('Restock essentials',starters)+categories.map(c=>shelf(c,result.filter(p=>p.category===c&&!priority.includes(p.sku)))).join('');
    }
    function render(focusSku,focusAction) {
      if (!live()) return;
      const usual=page==='usuals', review=page==='review';
      const headings={usuals:'Usual refill',catalog:'Team order builder',review:'Review your order'};
      const p=bySku(details);
      if(submittedId) {
        shell.innerHTML='<div class="cs-review-head"><span class="cs-eyebrow">Prairie Union Athletic Club</span><h2>Order '+escape(submittedId)+'</h2><p role="status">'+escape(feedback)+'</p>'+button('orders','Open orders','','cs-primary')+'</div>';
        return;
      }
      shell.innerHTML='<div class="cs-heading"><div class="cs-team"><span class="cs-monogram" aria-hidden="true">PU</span><div><span class="cs-eyebrow">Prairie Union Athletic Club</span><h1>'+headings[page]+'</h1></div></div>'+
        '<span class="cs-save" aria-live="polite">'+escape(saveError || 'Sample draft')+'</span></div>'+
        '<div class="cs-status" role="status">'+escape(feedback)+'</div>'+
        (p ? '<section class="cs-detail">'+button('close-detail','← Back to supplies','','cs-link')+'<div class="cs-detail-head">'+productImage(p)+'<div><span class="cs-eyebrow">'+escape(p.category)+'</span><h2>'+escape(p.name)+'</h2></div></div><p>'+escape(p.pack)+' · '+escape(p.sku)+'</p>'+badge(p)+'<dl><dt>Order increment</dt><dd>'+p.step+' '+escape(unit(p,p.step))+'</dd><dt>Estimated unit price</dt><dd>'+(p.cents===null?'Price on request':money(p.cents))+'</dd></dl>'+
          (editable && available(p) ? '<div class="cs-cart-action">'+button('add-cart','Add to cart',p.sku,'cs-primary',count(p.sku)+p.step>9999?'disabled':'')+'<span>'+p.step+' '+escape(unit(p,p.step))+' · '+money(p.step*p.cents)+'</span></div>' : controls(p))+
          (editable && !p.oneTime && available(p)?'<details class="cs-usual-editor"><summary>Usual quantity · '+p.par+' '+escape(unit(p,p.par))+'</summary><form id="csPar"><div class="cs-step">'+button('usual-less','−',p.sku,'','aria-label="Decrease usual quantity" '+(p.par===0?'disabled':''))+'<output id="csParQty" aria-label="Usual quantity">'+p.par+'</output>'+button('usual-more','+',p.sku,'','aria-label="Increase usual quantity"')+'</div><button class="cs-secondary">Save usual quantity</button></form></details>':'')+'</section>':
        review ? button('back','← Edit refill','','cs-link')+'<div class="cs-layout"><section class="cs-list"><div class="cs-review-head"><h2>Delivery &amp; PO</h2><p>Main receiving dock · Prairie Union Athletic Club</p><div class="cs-review-fields">'+field('csPo','Sample PO number',po)+field('csCenter','Sample cost center (optional)',center)+field('csNeed','Need by (optional)',needBy,'date')+'</div></div>'+
          lines().map(p=>'<div class="cs-review-row"><div><strong>'+escape(p.name)+'</strong><small>'+count(p.sku)+' '+escape(unit(p,count(p.sku)))+' · '+escape(p.pack)+'</small>'+(p.retired?'<small>Earlier pack in your draft</small>'+button('remove-earlier','Remove',p.sku,'cs-link'):'')+'</div><strong>'+money(p.cents*count(p.sku))+'</strong></div>').join('')+
          '<div class="cs-deliver"><h3>Delivery plan</h3>'+deliveryPlan()+'</div></section>'+summary(true)+'</div>':
        '<div class="cs-layout"><div>'+quickPanel()+
          '<details class="cs-filter-panel"'+(filtersOpen?' open':'')+'><summary>Filters'+(category||filter?' · active':'')+'</summary><div class="cs-filters">'+
          '<label>Area<select id="csCategory"><option value="">All areas</option>'+categories.map(c=>'<option '+(c===category?'selected':'')+'>'+escape(c)+'</option>').join('')+'</select></label>'+
          '<label>Show<select id="csFilter">'+[['','All supplies'],['stock','In stock'],['usual','Usual items'],['quote','Price on request']].map(([v,t])=>'<option value="'+v+'" '+(filter===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label></div></details>'+
          '<div class="cs-list" id="csResults">'+listing()+'</div></div>'+summary()+'</div>'+(lines().length ? button('review','Review refill · '+lines().length+' '+(lines().length===1?'item':'items')+'<span>'+money(subtotal())+' →</span>','','cs-phone-cart') : ''));

    function deliveryPlan() {
      const windows={'Local delivery':[1,2],Shipped:[2,5],'Specialty shipment':[3,7]};
      return (estimate?.groups || []).map((group,index)=>{
        const name=group.delivery_label;
        const items=(group.skus||[]).map(bySku).filter(Boolean);
        if(!windows[name])return '<p><strong>Delivery group '+(index+1)+'</strong><br><small>'+items.map(p=>escape(p.name)).join(' · ')+'</small></p>';
        const [min,max]=windows[name];
        const date=new Date(); let i=0; while(i<max){date.setDate(date.getDate()+1);if(![0,6].includes(date.getDay()))i++;}
        return '<p><strong>'+name+'</strong> · '+min+'–'+max+' business days (estimated)<br><small>'+items.map(p=>escape(p.name)).join(' · ')+'</small>'+
          (needBy && new Date(needBy+'T23:59:59')<date?'<br><b class="cs-alert">May arrive after your need-by date.</b>':'')+'</p>';
      }).join('');
    }

      }

    shell.addEventListener('click',async e=>{
      const b=e.target.closest('button[data-action]');if(!b||busy)return;
      const action=b.dataset.action,p=bySku(b.dataset.sku);
      if(!editable && ['plus','minus','skip','price','submit','apply'].includes(action))return;
      feedback='';
      try {
        if(action==='remove-earlier' && editable && p?.retired){
          setQty(p,0); await saver;
          if(lines().length)estimate=await api('/estimate','POST',{quantities}); else page='catalog';
          render();return;
        }
        if(action==='usual-less'||action==='usual-more'){
          const output=shell.querySelector('#csParQty');
          const qty=Math.max(0,Math.min(Math.floor(10000/p.step)*p.step,Number(output.value)+(action==='usual-more'?p.step:-p.step)));
          output.value=String(qty);
          shell.querySelector('[data-action="usual-less"]').disabled=qty===0;
          shell.querySelector('[data-action="usual-more"]').disabled=qty+p.step>10000;

          render();shell.querySelector('.cs-status').scrollIntoView({block:'nearest'});
          return;
        }
        if(action==='orders'){window.dispatchEvent(new CustomEvent('cagestock:orders',{detail:{id:submittedId}}));return;}
        if(action==='plus'||action==='minus'||action==='skip'){
          setQty(p,action==='skip'?0:Math.max(0,count(p.sku)+(action==='plus'?1:-1)*p.step));render(p.sku,action);return;
        }
        if(action==='suggest'||action==='detail'){details=p.sku;render();shell.scrollIntoView({block:'start'});return;}
        if(action==='close-detail')details='';
        if(action==='usuals'||action==='catalog'||action==='back'){page=action==='back'?'catalog':action;details='';query='';category='';filter='';}
        if(action==='price'){b.disabled=true;await api('/price-request','POST',{sku:p.sku});feedback='Sample price inquiry recorded on this device.';}
        if(action==='resolve'){quickEdits[Number(b.dataset.index)].sku=p.sku;}
        if(action==='search-miss'){page='catalog';query=quickEdits[Number(b.dataset.sku)].term;category='';filter='';}
        if(action==='discard'){quickEdits=[];query='';}
        if(action==='apply'){
          if(quickEdits.some(x=>x.qty!==null && (!Number.isSafeInteger(x.qty)||x.qty>9999))){feedback='Use a whole quantity under 10,000.';}
          else if(quickEdits.some(x=>x.options.length>1&&!x.sku)){feedback='Choose each ambiguous item before applying.';}
          else {
            const changes=quickEdits.filter(x=>x.sku&&available(bySku(x.sku)));
            for(const edit of changes){const item=bySku(edit.sku);quantities[item.sku]=edit.skip?0:Math.ceil((edit.qty??item.step)/item.step)*item.step;}
            quickEdits=quickEdits.filter(x=>!changes.includes(x));if(!quickEdits.length)query='';
            estimate=null;scheduleSave();feedback=changes.length+' matched '+(changes.length===1?'item updated.':'items updated.');
          }
        }
        if(action==='review'){
          busy=true;b.disabled=true;await saver;
          if(saveError){scheduleSave();await saver;if(saveError)throw Error(saveError);}
          estimate=await api('/estimate','POST',{quantities});page='review';shell.scrollIntoView({block:'start'});
        }
        if(action==='submit'){
          busy=true;b.disabled=true;await saver;
          if(saveError){scheduleSave();await saver;if(saveError)throw Error(saveError);}
          const approveNow=actor==='approver'&&!estimate?.has_unquoted_shipping;
          if(approveNow&&!po.trim())throw Error('Enter a team PO number before approving.');
          const order=await api('/submit','POST',{quantities,po:po.trim(),costCenter:center.trim(),needBy,draftId:draftMeta.draftId,version:draftMeta.version});
          if(approveNow && order.status==='pending_approval'){
            try { await api('/orders/'+encodeURIComponent(order.id)+'/actions','POST',{action:'approve',po:po.trim()}); }
            catch(error) { submittedId=order.id;feedback='Submitted for approval. '+error.message;render();return; }
          }
          window.dispatchEvent(new CustomEvent('cagestock:orders',{detail:{id:order.id}}));return;
        }
      }catch(error){feedback=error.message||'Could not complete this action.';}
      finally{busy=false;}
      render();
    },{signal});
    render();
  };

const storageKey='cagestock-public-demo-v1';
let draft={quantities:{},po:'DEMO-1042'}, usual={};
try { const saved=JSON.parse(sessionStorage.getItem(storageKey)||'{}'); draft={...draft,...saved.draft};usual=saved.usual||{} } catch {}
function save(){try{sessionStorage.setItem(storageKey,JSON.stringify({draft,usual}))}catch{}}
for(const p of catalog){p.purchaseCount=p.par?Math.max(1,20-(p.usualRank||19)):0;if(Object.hasOwn(usual,p.sku))p.par=usual[p.sku]}
function estimate(q){const items=catalog.filter(p=>q[p.sku]>0&&p.cents!=null);const subtotal=items.reduce((n,p)=>n+p.cents*q[p.sku],0);const delivery=items.length?1200:0,fee=items.length?3000:0;return {totals:{delivery_cents:delivery,fee_cents:fee,tax_cents:0,total_cents:subtotal+delivery+fee},groups:items.length?[{delivery_label:'Shipped',skus:items.map(p=>p.sku)}]:[]}}
async function demoApi(path,method,body){switch(path){case '/catalog':return catalog;case '/draft':if(method==='PUT'){draft={...body};save()}return draft;case '/usual':usual[body.sku]=body.par;save();return {};case '/price-request':return {};case '/estimate':return estimate(body.quantities);case '/submit':return {id:'DEMO-1042'};default:throw Error('Unavailable in this demo.')}}
const main=document.getElementById('main');
function openBuilder(){window.showCatalog(main,demoApi,'manager','catalog')}
function money(cents){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(cents/100)}
window.addEventListener('cagestock:orders',()=>{main._csDestroy?.();main.innerHTML='<section class="receipt"><small>PRAIRIE UNION ATHLETIC CLUB</small><h1>Sample AP invoice</h1><p id="po"></p><ul></ul><dl></dl><p>Demo only. No payment is due.</p><button type="button">Back to order builder</button></section>';main.querySelector('#po').textContent='Team PO · '+(draft.po||'Unassigned');for(const p of catalog.filter(p=>draft.quantities[p.sku]>0)){const li=document.createElement('li');li.textContent=p.name+' × '+draft.quantities[p.sku]+' · '+money(p.cents*draft.quantities[p.sku]);main.querySelector('ul').append(li)}const t=estimate(draft.quantities).totals;for(const [name,value] of [['Sample delivery',t.delivery_cents],['Sample service fee',t.fee_cents],['Sample tax',t.tax_cents],['Sample invoice total',t.total_cents]]){let dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=name;dd.textContent=money(value);main.querySelector('dl').append(dt,dd)}main.querySelector('button').onclick=openBuilder;window.scrollTo(0,0)});openBuilder();
